<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Track a Parcel | The Courier Guy</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff; color: #333; }
    a { text-decoration: none; color: inherit; }

    /* ── Banner ── */
    .top-banner { background: #1a3a6b; color: #f5a623; text-align: center; padding: 9px 16px; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    .top-banner.hidden { display: none; }

    /* ── Nav ── */
    header { background: #fff; border-bottom: 1px solid #e8eef4; position: sticky; top: 0; z-index: 100; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 48px; max-width: 1400px; margin: 0 auto; }
    .logo img { height: 68px; display: block; }

    .nav-links { display: flex; align-items: center; gap: 6px; list-style: none; }
    .nav-links > li { position: relative; }
    .nav-links > li > span {
      display: flex; align-items: center; gap: 5px; padding: 10px 14px;
      color: #1a3a6b; font-weight: 600; font-size: 15px; border-radius: 6px;
      cursor: default; user-select: none;
    }
    .arrow-icon { width: 10px; height: 10px; fill: #1a3a6b; }

    .dropdown { display: none; position: absolute; top: calc(100% + 4px); left: 0; background: #fff; border: 1px solid #dce8f0; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.1); min-width: 180px; list-style: none; padding: 6px 0; z-index: 200; }
    .nav-links > li:hover .dropdown { display: block; }
    .dropdown li span { display: block; padding: 9px 18px; color: #1a3a6b; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: default; }

    /* Auth button area */
    .nav-auth { display: flex; align-items: center; gap: 10px; }
    .auth-user { font-size: 14px; font-weight: 600; color: #1a3a6b; }
    .btn-nav { padding: 9px 18px; border-radius: 30px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
    .btn-nav-outline { background: transparent; border: 2px solid #1a3a6b; color: #1a3a6b; }
    .btn-nav-fill { background: #1a3a6b; color: #fff; }
    .btn-nav:hover { opacity: .8; }

    /* ── Hero ── */
    .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 90px 20px 110px; }
    .hero h1 { font-size: 40px; font-weight: 800; color: #1a3a6b; margin-bottom: 34px; }
    .track-form { display: flex; align-items: center; }
    .track-form input { width: 380px; padding: 18px 28px; border: 2px solid #cfdce9; border-right: none; border-radius: 40px 0 0 40px; font-size: 15px; outline: none; background: #f5f8fb; }
    .track-form input:focus { border-color: #1a3a6b; }
    .track-form button { padding: 18px 34px; background: #f5a623; color: #fff; border: none; border-radius: 40px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .track-form button:hover { background: #e0941a; }

    /* ── Tracking Result ── */
    .result-section { max-width: 720px; margin: 0 auto 60px; padding: 0 20px; display: none; }

    .result-card { background: #fff; border: 1px solid #dce8f0; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
    .result-header { background: #1a3a6b; color: #fff; padding: 24px 28px; display: flex; justify-content: space-between; align-items: flex-start; }
    .result-header h2 { font-size: 14px; font-weight: 600; opacity: .75; margin-bottom: 4px; }
    .result-waybill { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
    .status-badge { padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .status-Pending     { background: #fef3c7; color: #92400e; }
    .status-Collected   { background: #dbeafe; color: #1e40af; }
    .status-InTransit   { background: #ede9fe; color: #6d28d9; }
    .status-OutForDelivery { background: #fce7f3; color: #9d174d; }
    .status-Delivered   { background: #dcfce7; color: #166534; }
    .status-Failed      { background: #fee2e2; color: #991b1b; }

    .result-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-bottom: 1px solid #e8eef4; }
    .meta-item { padding: 18px 28px; border-right: 1px solid #e8eef4; }
    .meta-item:last-child { border-right: none; }
    .meta-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: #94a3b8; margin-bottom: 4px; }
    .meta-value { font-size: 15px; font-weight: 600; color: #1a3a6b; }

    /* Timeline */
    .timeline { padding: 24px 28px; }
    .timeline h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: #94a3b8; margin-bottom: 20px; }
    .timeline-item { display: flex; gap: 16px; position: relative; padding-bottom: 20px; }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before { content: ''; position: absolute; left: 10px; top: 20px; bottom: 0; width: 2px; background: #e8eef4; }
    .timeline-item:last-child::before { display: none; }
    .tl-dot { width: 22px; height: 22px; border-radius: 50%; background: #1a3a6b; flex-shrink: 0; display: flex; align-items: center; justify-content: center; z-index: 1; }
    .tl-dot.latest { background: #f5a623; }
    .tl-dot svg { width: 10px; height: 10px; fill: #fff; }
    .tl-body { flex: 1; }
    .tl-status { font-size: 14px; font-weight: 700; color: #1a3a6b; }
    .tl-note { font-size: 13px; color: #64748b; margin-top: 2px; }
    .tl-meta { font-size: 12px; color: #94a3b8; margin-top: 4px; }

    .result-error { text-align: center; padding: 40px; color: #ef4444; font-size: 15px; font-weight: 600; }

    /* ── Carousel ── */
    .carousel-section { background: #f4f8fc; }
    .carousel { overflow: hidden; }
    .carousel-track { display: flex; transition: transform 0.6s ease; }
    .slide { min-width: 100%; padding: 70px 80px; min-height: 280px; background: linear-gradient(135deg,#eaf1f8 0%,#d4e4f0 100%); }
    .slide h2 { font-size: 32px; font-weight: 800; color: #1a3a6b; margin-bottom: 16px; line-height: 1.2; max-width: 560px; }
    .slide p { font-size: 15px; color: #444; line-height: 1.7; max-width: 560px; }
    .carousel-dots { display: flex; justify-content: center; gap: 8px; padding: 18px 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #bcd0e0; cursor: default; border: none; }
    .dot.active { background: #1a3a6b; }

    /* ── Contact Band ── */
    .contact-band { background: #6b96c1; padding: 55px 20px; text-align: center; }
    .contact-band p { color: #fff; font-size: 17px; font-weight: 500; }
    .contact-band span { color: #fff; font-weight: 700; }
    .contact-band.hidden { display: none; }

    /* ── Footer ── */
    footer { background: #1a3a6b; color: #fff; padding: 56px 48px 0; }
    .footer-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr; gap: 40px; max-width: 1300px; margin: 0 auto; padding-bottom: 48px; }
    .footer-col h3 { font-size: 14px; font-weight: 700; letter-spacing: .5px; margin-bottom: 16px; text-transform: uppercase; }
    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .footer-col ul li span { color: #c8daea; font-size: 14px; cursor: default; }
    .qc-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .qc-item svg { width: 15px; height: 15px; fill: #f5a623; flex-shrink: 0; margin-top: 2px; }
    .qc-item span { color: #c8daea; font-size: 14px; line-height: 1.6; }

    .follow-section { background: #152f58; padding: 30px 48px; }
    .follow-inner { max-width: 1300px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .follow-section h3 { color: #fff; font-size: 15px; font-weight: 700; }
    .social-icons { display: flex; gap: 14px; }
    .social-icons span { width: 36px; height: 36px; background: rgba(255,255,255,.12); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: default; }
    .social-icons svg { width: 16px; height: 16px; fill: #fff; }

    .whistle-bar { background: #f5a623; text-align: center; padding: 12px 20px; font-size: 13px; color: #1a3a6b; font-weight: 600; }
    .whistle-bar.hidden { display: none; }

    .footer-bottom { background: #111e35; padding: 18px 48px; }
    .footer-bottom-inner { max-width: 1300px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .footer-bottom p, .footer-bottom span { color: #7a99b8; font-size: 13px; }
    .footer-links { display: flex; gap: 20px; }

    /* ── Auth Modal ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; position: relative; }
    .modal h2 { font-size: 22px; font-weight: 800; color: #1a3a6b; margin-bottom: 6px; }
    .modal p.sub { color: #64748b; font-size: 14px; margin-bottom: 28px; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 20px; cursor: pointer; color: #94a3b8; }
    .modal-tabs { display: flex; gap: 0; margin-bottom: 24px; background: #f1f5f9; border-radius: 10px; padding: 4px; }
    .modal-tab { flex: 1; padding: 8px; background: none; border: none; font-size: 14px; font-weight: 600; color: #64748b; border-radius: 8px; cursor: pointer; transition: all .15s; }
    .modal-tab.active { background: #fff; color: #1a3a6b; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 6px; }
    .field input { width: 100%; padding: 11px 14px; border: 1.5px solid #dce8f0; border-radius: 8px; font-size: 14px; outline: none; transition: border-color .15s; }
    .field input:focus { border-color: #1a3a6b; }
    .btn-full { width: 100%; padding: 13px; background: #1a3a6b; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; transition: opacity .15s; }
    .btn-full:hover { opacity: .88; }
    .modal-error { background: #fee2e2; color: #991b1b; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
    .modal-error.show { display: block; }

    /* ── Hamburger ── */
    .hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 6px; }
    .hamburger span { display: block; width: 24px; height: 2px; background: #1a3a6b; border-radius: 2px; transition: all .25s; }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* ── Mobile Nav Drawer ── */
    .mobile-nav { display: none; flex-direction: column; background: #fff; border-top: 1px solid #e8eef4; padding: 12px 0; }
    .mobile-nav.open { display: flex; }
    .mobile-nav-item { padding: 12px 24px; color: #1a3a6b; font-weight: 600; font-size: 15px; border-bottom: 1px solid #f0f4f8; cursor: default; }
    .mobile-nav-sub { padding: 8px 36px; color: #4a6fa5; font-size: 14px; background: #f8fafc; cursor: default; }
    .mobile-auth { display: flex; gap: 10px; padding: 14px 24px; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      nav { padding: 12px 20px; }
      .nav-links { display: none; }
      .hamburger { display: flex; }
      footer { padding: 40px 20px 0; }
      .footer-grid { grid-template-columns: 1fr 1fr; gap: 28px; }
      .follow-section { padding: 24px 20px; }
      .follow-inner { flex-direction: column; align-items: flex-start; gap: 14px; }
      .footer-bottom { padding: 16px 20px; }
      .footer-bottom-inner { flex-direction: column; align-items: flex-start; gap: 8px; }
      .nav-auth { display: none; }
      .slide { padding: 50px 40px; min-height: 220px; }
      .slide h2 { font-size: 26px; }
    }

    @media (max-width: 600px) {
      nav { padding: 10px 16px; }
      .logo img { height: 50px; }
      .hero { padding: 50px 16px 60px; }
      .hero h1 { font-size: 26px; text-align: center; }
      .track-form { flex-direction: column; width: 100%; gap: 10px; }
      .track-form input { width: 100%; border-right: 2px solid #cfdce9; border-radius: 40px; padding: 15px 22px; }
      .track-form input:focus { border-color: #1a3a6b; }
      .track-form button { width: 100%; border-radius: 40px; padding: 15px; }
      .result-section { padding: 0 12px; }
      .result-header { flex-direction: column; gap: 12px; }
      .result-meta { grid-template-columns: 1fr; }
      .meta-item { border-right: none; border-bottom: 1px solid #e8eef4; }
      .meta-item:last-child { border-bottom: none; }
      .result-header, .timeline, .result-meta .meta-item { padding: 18px 18px; }
      .slide { padding: 36px 20px; min-height: auto; }
      .slide h2 { font-size: 20px; }
      .slide p { font-size: 14px; }
      .footer-grid { grid-template-columns: 1fr; gap: 24px; }
      .footer-bottom-inner { gap: 6px; }
      .footer-links { flex-wrap: wrap; gap: 12px; }
      .modal { padding: 28px 20px; border-radius: 12px; }
      .contact-band p { font-size: 15px; }
      .whistle-bar { font-size: 12px; padding: 10px 14px; }
      .top-banner { font-size: 12px; padding: 7px 12px; }
    }
  </style>
</head>
<body>

<!-- BANNER -->
<div class="top-banner" id="banner"></div>

<!-- HEADER -->
<header>
  <nav>
    <div class="logo"><img src="/public/logo.png" alt="The Courier Guy"/></div>

    <ul class="nav-links" id="navLinks"></ul>

    <div class="nav-auth" id="navAuth">
      <button class="btn-nav btn-nav-outline" onclick="openModal('login')">Login</button>
      <button class="btn-nav btn-nav-fill" onclick="openModal('register')">Register</button>
    </div>
    <button class="hamburger" id="hamburger" onclick="toggleMobileNav()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>
  <div class="mobile-nav" id="mobileNav"></div>
</header>

<!-- HERO -->
<section class="hero">
  <h1 id="heroTitle">Track my parcel</h1>
  <div class="track-form">
    <input type="text" id="waybillInput" placeholder="Waybill number" onkeydown="if(event.key==='Enter') trackParcel()"/>
    <button onclick="trackParcel()" id="trackBtn">Track Now</button>
  </div>
</section>

<!-- TRACKING RESULT -->
<div class="result-section" id="resultSection"></div>

<!-- CAROUSEL -->
<div class="carousel-section">
  <div class="carousel"><div class="carousel-track" id="carouselTrack"></div></div>
  <div class="carousel-dots" id="carouselDots"></div>
</div>

<!-- CONTACT BAND -->
<section class="contact-band" id="contactBand">
  <p id="contactText"></p>
</section>

<!-- FOOTER -->
<footer>
  <div class="footer-grid">
    <div class="footer-col" id="footerContact"><h3>Quick Contact</h3></div>
    <div class="footer-col"><h3>Our Company</h3><ul id="footerCompany"></ul></div>
    <div class="footer-col"><h3>Explore</h3><ul id="footerExplore"></ul></div>
    <div class="footer-col"><h3>Services</h3><ul id="footerServices"></ul></div>
    <div class="footer-col"><h3>Support</h3><ul id="footerSupport"></ul></div>
  </div>
</footer>

<div class="follow-section">
  <div class="follow-inner">
    <h3>Follow The Courier Guy</h3>
    <div class="social-icons" id="socialIcons"></div>
  </div>
</div>

<div class="whistle-bar" id="whistleBar"></div>

<div class="footer-bottom">
  <div class="footer-bottom-inner">
    <p>© Copyright <span id="yr"></span> <span id="copyright"></span></p>
    <div class="footer-links">
      <span>Privacy Policy</span>
      <span>Terms &amp; Conditions</span>
    </div>
  </div>
</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2>Welcome</h2>
    <div class="modal-tabs">
      <button class="modal-tab active" id="tabLogin" onclick="switchTab('login')">Login</button>
      <button class="modal-tab" id="tabRegister" onclick="switchTab('register')">Register</button>
    </div>
    <div class="modal-error" id="authError"></div>

    <!-- Login form -->
    <div id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="you@example.com"/></div>
      <div class="field"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••"/></div>
      <button class="btn-full" onclick="doLogin()">Login</button>
    </div>

    <!-- Register form -->
    <div id="registerForm" style="display:none">
      <div class="field"><label>Full Name</label><input type="text" id="regName" placeholder="John Doe"/></div>
      <div class="field"><label>Email</label><input type="email" id="regEmail" placeholder="you@example.com"/></div>
      <div class="field"><label>Password</label><input type="password" id="regPassword" placeholder="Min 6 characters"/></div>
      <button class="btn-full" onclick="doRegister()">Create Account</button>
    </div>
  </div>
</div>

const STATUS_LABELS = { 'In Transit': 'InTransit', 'Out for Delivery': 'OutForDelivery' };
const CHECK_SVG = '<path d="M173.898 439.404l-166.4-166.4c-9.997-9.997-9.997-26.206 0-36.204l36.203-36.204c9.997-9.998 26.207-9.998 36.204 0L192 312.69 432.095 72.596c9.997-9.997 26.207-9.997 36.204 0l36.203 36.204c9.997 9.997 9.997 26.206 0 36.204l-294.4 294.401c-9.998 9.997-26.207 9.997-36.204-.001z"/>';

let currentUser = null;
let carouselCurrent = 0, carouselTotal = 0, autoSlide;

// ── Mobile Nav ───────────────────────────────────────────────
function toggleMobileNav() {
  const nav = document.getElementById('mobileNav');
  const btn = document.getElementById('hamburger');
  nav.classList.toggle('open');
  btn.classList.toggle('open');
}

function buildMobileNav(menus) {
  const nav = document.getElementById('mobileNav');
  let html = '';
  Object.entries(menus).forEach(([label, items]) => {
    html += `<div class="mobile-nav-item">${label}</div>`;
    items.forEach(i => { html += `<div class="mobile-nav-sub">${i.label}</div>`; });
  });
  html += `<div class="mobile-auth" id="mobileAuth">
    <button class="btn-nav btn-nav-outline" onclick="openModal('login')">Login</button>
    <button class="btn-nav btn-nav-fill" onclick="openModal('register')">Register</button>
  </div>`;
  nav.innerHTML = html;
}

function updateMobileAuth() {
  const el = document.getElementById('mobileAuth');
  if (!el) return;
  if (currentUser) {
    el.innerHTML = `<span class="auth-user" style="padding:4px 0">👤 ${currentUser.name}</span>
      <button class="btn-nav btn-nav-outline" onclick="doLogout()">Logout</button>`;
  } else {
    el.innerHTML = `<button class="btn-nav btn-nav-outline" onclick="openModal('login')">Login</button>
      <button class="btn-nav btn-nav-fill" onclick="openModal('register')">Register</button>`;
  }
}

// ── Carousel ─────────────────────────────────────────────────
function goToSlide(n) {
  carouselCurrent = n;
  document.getElementById('carouselTrack').style.transform = `translateX(-${n*100}%)`;
  document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i===n));
}
function startAuto() {
  clearInterval(autoSlide);
  autoSlide = setInterval(() => goToSlide((carouselCurrent+1) % carouselTotal), 3000);
}

// ── Tracking ─────────────────────────────────────────────────
async function trackParcel() {
  const waybill = document.getElementById('waybillInput').value.trim();
  if (!waybill) return;
  const btn = document.getElementById('trackBtn');
  btn.textContent = 'Searching…'; btn.disabled = true;

  const section = document.getElementById('resultSection');
  section.style.display = 'block';
  section.scrollIntoView({ behavior: 'smooth', block: 'start' });

  try {
    const res = await fetch('/api/track/' + encodeURIComponent(waybill));
    if (!res.ok) {
      const err = await res.json();
      section.innerHTML = `<div class="result-error">⚠ ${err.error}</div>`;
      return;
    }
    const t = await res.json();
    const statusKey = STATUS_LABELS[t.status] || t.status.replace(/\s/g,'');
    const history = [...t.history].reverse();
    section.innerHTML = `
      <div class="result-card">
        <div class="result-header">
          <div>
            <h2>Waybill Number</h2>
            <div class="result-waybill">${t.waybill}</div>
          </div>
          <span class="status-badge status-${statusKey}">${t.status}</span>
        </div>
        <div class="result-meta">
          <div class="meta-item"><div class="meta-label">From</div><div class="meta-value">${t.origin || '—'}</div></div>
          <div class="meta-item"><div class="meta-label">To</div><div class="meta-value">${t.destination || '—'}</div></div>
          <div class="meta-item"><div class="meta-label">Customer</div><div class="meta-value">${t.customer.name}</div></div>
          <div class="meta-item"><div class="meta-label">Last Updated</div><div class="meta-value">${fmtDate(t.updatedAt)}</div></div>
        </div>
        <div class="timeline">
          <h3>Tracking History</h3>
          ${history.map((h, i) => `
            <div class="timeline-item">
              <div class="tl-dot ${i===0?'latest':''}"><svg viewBox="0 0 512 512">${CHECK_SVG}</svg></div>
              <div class="tl-body">
                <div class="tl-status">${h.status}</div>
                ${h.note ? `<div class="tl-note">${h.note}</div>` : ''}
                <div class="tl-meta">${h.location ? h.location + ' · ' : ''}${fmtDate(h.timestamp)}</div>
              </div>
            </div>`).join('')}
        </div>
      </div>`;
  } catch (e) {
    section.innerHTML = `<div class="result-error">⚠ Server error. Please try again.</div>`;
  } finally {
    btn.textContent = 'Track Now'; btn.disabled = false;
  }
}

function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('en-ZA', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hour12: true });
}

// ── Auth Modal ───────────────────────────────────────────────
function openModal(tab) { document.getElementById('authModal').classList.add('open'); switchTab(tab); }
function closeModal() { document.getElementById('authModal').classList.remove('open'); clearErr(); }
function switchTab(tab) {
  document.getElementById('loginForm').style.display = tab==='login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab==='register' ? 'block' : 'none';
  document.getElementById('tabLogin').classList.toggle('active', tab==='login');
  document.getElementById('tabRegister').classList.toggle('active', tab==='register');
  clearErr();
}
function showErr(msg) { const e=document.getElementById('authError'); e.textContent=msg; e.classList.add('show'); }
function clearErr() { document.getElementById('authError').classList.remove('show'); }

async function doLogin() {
  clearErr();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) return showErr('Please fill in all fields.');
  const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password}) });
  const data = await res.json();
  if (!res.ok) return showErr(data.error);
  currentUser = data.user;
  updateNavAuth();
  closeModal();
}

async function doRegister() {
  clearErr();
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  if (!name || !email || !password) return showErr('Please fill in all fields.');
  if (password.length < 6) return showErr('Password must be at least 6 characters.');
  const res = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name,email,password}) });
  const data = await res.json();
  if (!res.ok) return showErr(data.error);
  currentUser = data.user;
  updateNavAuth();
  closeModal();
}

async function doLogout() {
  await fetch('/api/auth/logout', { method:'POST' });
  currentUser = null;
  updateNavAuth();
}

function updateNavAuth() {
  const el = document.getElementById('navAuth');
  if (currentUser) {
    el.innerHTML = `<span class="auth-user">👤 ${currentUser.name}</span>
      <button class="btn-nav btn-nav-outline" onclick="doLogout()">Logout</button>`;
  } else {
    el.innerHTML = `<button class="btn-nav btn-nav-outline" onclick="openModal('login')">Login</button>
      <button class="btn-nav btn-nav-fill" onclick="openModal('register')">Register</button>`;
  }
  updateMobileAuth();
}

// Close modal on overlay click
document.getElementById('authModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

// ── Render content ───────────────────────────────────────────
function deadLinks(items) {
  return items.map(i => `<li><span>${i.label}</span></li>`).join('');
}

async function render() {
  const [c, me] = await Promise.all([
    fetch('/api/content').then(r => r.json()),
    fetch('/api/auth/me').then(r => r.json())
  ]);
  if (me.user) { currentUser = me.user; updateNavAuth(); }

  // Banner
  const banner = document.getElementById('banner');
  banner.textContent = c.banner.text;
  if (!c.banner.visible) banner.classList.add('hidden');

  // Nav — dead items
  const menus = { Shipping: c.nav.shipping, Tracking: c.nav.tracking, Support: c.nav.support, Login: c.nav.login };
  document.getElementById('navLinks').innerHTML = Object.entries(menus).map(([label, items]) => `
    <li>
      <span>${label} <svg class="arrow-icon" viewBox="0 0 448 512"><path d="M207 381L13 187c-9-9-9-25 0-34l23-23c9-9 25-9 34 0L224 285l155-155c9-9 25-9 34 0l23 23c9 9 9 25 0 34L241 381c-9 9-25 9-34 0z"/></svg></span>
      <ul class="dropdown">${items.map(i=>`<li><span>${i.label}</span></li>`).join('')}</ul>
    </li>`).join('');
  buildMobileNav(menus);

  // Hero
  document.getElementById('heroTitle').textContent = c.hero.title;
  document.getElementById('waybillInput').placeholder = c.hero.placeholder;
  document.getElementById('trackBtn').textContent = c.hero.buttonText;

  // Carousel
  carouselTotal = c.carousel.length;
  document.getElementById('carouselTrack').innerHTML = c.carousel.map(s =>
    `<div class="slide"><h2>${s.title}</h2><p>${s.body}</p></div>`).join('');
  document.getElementById('carouselDots').innerHTML = c.carousel.map((_,i) =>
    `<button class="dot${i===0?' active':''}" onclick="goToSlide(${i})"></button>`).join('');
  startAuto();

  // Contact band
  const cb = c.contactBand;
  document.getElementById('contactText').innerHTML = `${cb.text} <span>${cb.email}</span> or <span>${cb.phone}</span>.`;
  if (!cb.visible) document.getElementById('contactBand').classList.add('hidden');

  // Footer quick contact — dead links
  const qc = c.footer.quickContact;
  document.getElementById('footerContact').innerHTML = `<h3>Quick Contact</h3>
    <div class="qc-item"><svg viewBox="0 0 320 512"><path d="M272 0H48C21.5 0 0 21.5 0 48v416c0 26.5 21.5 48 48 48h224c26.5 0 48-21.5 48-48V48c0-26.5-21.5-48-48-48zM160 480c-17.7 0-32-14.3-32-32s14.3-32 32-32 32 14.3 32 32-14.3 32-32 32z"/></svg><span>${qc.phone}</span></div>
    <div class="qc-item"><svg viewBox="0 0 512 512"><path d="M502.3 190.8c3.9-3.1 9.7-.2 9.7 4.7V400c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48V195.6c0-5 5.7-7.8 9.7-4.7 22.4 17.4 52.1 39.5 154.1 113.6 21.1 15.4 56.7 47.8 92.2 47.6 35.7.3 72-32.8 92.3-47.6 102-74.1 131.6-96.3 154-113.7zM256 320c23.2.4 56.6-29.2 73.4-41.4 132.7-96.3 142.8-104.7 173.4-128.7 5.8-4.5 9.2-11.5 9.2-18.9v-19c0-26.5-21.5-48-48-48H48C21.5 64 0 85.5 0 112v19c0 7.4 3.4 14.3 9.2 18.9 30.6 23.9 40.7 32.4 173.4 128.7 16.8 12.2 50.2 41.8 73.4 41.4z"/></svg><span>${qc.email}</span></div>
    <div class="qc-item"><svg viewBox="0 0 384 512"><path d="M172.268 501.67C26.97 291.031 0 269.413 0 192 0 85.961 85.961 0 192 0s192 85.961 192 192c0 77.413-26.97 99.031-172.268 309.67-9.535 13.774-29.93 13.773-39.464 0zM192 272c44.183 0 80-35.817 80-80s-35.817-80-80-80-80 35.817-80 80 35.817 80 80 80z"/></svg><span>${qc.address}</span></div>`;

  document.getElementById('footerCompany').innerHTML = deadLinks(c.footer.company);
  document.getElementById('footerExplore').innerHTML = deadLinks(c.footer.explore);
  document.getElementById('footerServices').innerHTML = deadLinks(c.footer.services);
  document.getElementById('footerSupport').innerHTML = deadLinks(c.footer.support);

  // Social — dead
  document.getElementById('socialIcons').innerHTML = Object.keys(c.social).map(key => {
    const [vb, path] = SOCIAL_SVGS[key] || ['512 512',''];
    return `<span><svg viewBox="0 0 ${vb}">${path}</svg></span>`;
  }).join('');

  // Whistleblower
  const wb = c.whistleblower;
  document.getElementById('whistleBar').textContent = `${wb.text} ${wb.linkText}`;
  if (!wb.visible) document.getElementById('whistleBar').classList.add('hidden');

  document.getElementById('yr').textContent = new Date().getFullYear();
  document.getElementById('copyright').textContent = c.copyright;
}

render();
</script>
</body>
</html>
